<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .container {
      width: 300px;
      height: 200px;
      background-color: lightblue;
      transform: translateZ(0); /* 强制分层 */
    }

    .hidden {
      display: none;
    }

    .text {
      color: red;
      font-size: 24px;
    }

    .composite {
      width: 100px;
      height: 100px;
      background: green;
      transform: translateX(10px); /* 会触发独立合成层 */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">Hello Render Tree</div>
    <div class="hidden">This will not render</div>
    <div class="composite"></div>
  </div>
</body>
</html>
